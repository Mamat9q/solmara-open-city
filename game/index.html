<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMARA — Open-City Crime</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b1026;
    font-family: system-ui, -apple-system, "Segoe UI", sans-serif; color: #eef1f5; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; }
  #hud-tl { position: absolute; top: 14px; left: 16px; text-shadow: 0 1px 4px #000; }
  .hud-line { font-size: 20px; font-weight: 700; }
  .hud-line.small { font-size: 14px; font-weight: 600; opacity: .92; }
  .hud-bar { width: 170px; height: 6px; background: rgba(0,0,0,.55); border-radius: 3px; margin-top: 4px; }
  #hud-respect { height: 100%; width: 0%; background: #2fd95f; border-radius: 3px; }
  #hud-tr { position: absolute; top: 14px; right: 16px; text-align: right; text-shadow: 0 1px 4px #000; }
  #hud-stars { font-size: 26px; letter-spacing: 2px; }
  .star { color: rgba(255,255,255,.25); }
  .star.on { color: #ffd23f; text-shadow: 0 0 8px #ff9a00; }
  #hud-bl { position: absolute; left: 16px; bottom: 16px; }
  #minimap { border: 2px solid rgba(255,255,255,.35); border-radius: 50%; background: rgba(8,12,20,.8); }
  #hud-district { text-align: center; font-size: 13px; font-weight: 700; margin-top: 4px; text-shadow: 0 1px 4px #000; }
  #hud-bc { position: absolute; left: 50%; bottom: 18px; transform: translateX(-50%); text-align: center; width: 560px; }
  #hud-objective { font-size: 17px; font-weight: 700; text-shadow: 0 1px 4px #000, 0 0 12px #000; }
  #hud-sub { font-size: 14px; color: #ffd23f; text-shadow: 0 1px 4px #000; margin-top: 2px; }
  #hud-br { position: absolute; right: 16px; bottom: 16px; text-align: right; text-shadow: 0 1px 4px #000; }
  #hud-speed { font-size: 26px; font-weight: 800; }
  #hud-wheel { margin: 6px 0; }
  .wslot { font-size: 12px; font-weight: 700; padding: 3px 7px; margin-left: 4px; border-radius: 4px;
    background: rgba(0,0,0,.55); color: #cfd3d8; }
  .wslot.on { background: #ffd23f; color: #111; }
  #hud-hint { font-size: 11px; opacity: .75; max-width: 340px; }
  #hud-toast { position: absolute; top: 84px; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,.72);
    padding: 9px 18px; border-radius: 6px; font-size: 16px; font-weight: 600; opacity: 0; transition: opacity .25s; white-space: nowrap; }
  #hud-toast.show { opacity: 1; }
  #hud-banner { position: absolute; top: 32%; left: 50%; transform: translateX(-50%); text-align: center;
    opacity: 0; transition: opacity .4s; pointer-events: none; }
  #hud-banner.show { opacity: 1; }
  #hud-banner-title { font-size: 40px; font-weight: 900; letter-spacing: 2px; text-shadow: 0 2px 10px #000; }
  #hud-banner-sub { font-size: 16px; text-shadow: 0 1px 6px #000; }
  #hud-panel { position: absolute; inset: 0; display: none; pointer-events: auto; background: rgba(4,6,14,.55); }
  #hud-start { position: absolute; inset: 0; display: none; pointer-events: auto; background: rgba(4,6,14,.45); overflow: auto; }
  .panel { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); width: 860px; max-width: 94vw;
    max-height: 92vh; overflow: auto; background: rgba(10,14,26,.94); border: 1px solid #3a4356; border-radius: 12px;
    padding: 18px 24px; box-shadow: 0 10px 60px #000; }
  .panel.start { width: 920px; }
  .panel h1 { margin: 0; font-size: 54px; letter-spacing: 6px; color: #ffd23f; text-shadow: 0 0 24px rgba(255,122,60,.7); }
  .panel h2 { margin: 0 0 10px; font-size: 26px; color: #ffd23f; }
  .panel h3 { margin: 12px 0 6px; font-size: 15px; color: #7fb5ff; }
  .tag { font-size: 14px; opacity: .9; margin: 2px 0 8px; }
  .cols { display: flex; gap: 26px; }
  .cols > div { flex: 1; }
  .mlist { font-size: 13px; line-height: 1.5; }
  .mrow { font-size: 14px; line-height: 1.55; padding: 3px 0; border-bottom: 1px solid rgba(255,255,255,.07); }
  .keys { font-size: 13px; line-height: 1.65; opacity: .95; }
  .cta { margin-top: 14px; font-size: 17px; font-weight: 800; color: #2fd95f; text-align: center; }
  .fine { margin-top: 6px; font-size: 12px; opacity: .7; text-align: center; }
  button { pointer-events: auto; cursor: pointer; background: #ffd23f; color: #111; border: 0; border-radius: 5px;
    font-weight: 700; padding: 4px 10px; margin-left: 6px; font-size: 13px; }
  button:hover { background: #ffe27a; }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="SOLMARA: drive, steal cars, outrun the police and finish 10 story missions before Hurricane Mara lands"></canvas>
<div id="hud"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
