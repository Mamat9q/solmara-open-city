<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" href="data:,">
<title>SOLMARA — Open City</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e1a; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #game { position: fixed; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }
  #hud { position: fixed; inset: 0; pointer-events: none; color: #f2f4f8; text-shadow: 0 1px 3px rgba(0,0,0,.8); user-select: none; }
  #hud .top-left { position: absolute; top: 14px; left: 16px; font-size: 20px; line-height: 1.35; }
  #wanted { color: #ffd23f; letter-spacing: 2px; font-size: 26px; }
  #wanted .dim { color: rgba(255,255,255,.28); }
  #hud .top-right { position: absolute; top: 14px; right: 16px; text-align: right; font-size: 19px; line-height: 1.4; }
  #cash { color: #7dff9b; font-weight: 700; }
  #hud .bottom-left { position: absolute; left: 16px; bottom: 14px; font-size: 18px; line-height: 1.5; }
  #healthbar { width: 190px; height: 12px; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.5); margin-top: 4px; }
  #healthfill { height: 100%; width: 100%; background: #43e06a; }
  #hud .bottom-right { position: absolute; right: 16px; bottom: 14px; text-align: right; font-size: 18px; line-height: 1.45; }
  #speed { font-size: 34px; font-weight: 800; }
  #objective { position: absolute; top: 14px; left: 50%; transform: translateX(-50%); max-width: 560px; text-align: center;
    font-size: 19px; background: rgba(5,8,20,.55); padding: 8px 18px; border-radius: 8px; border: 1px solid rgba(255,210,63,.45); }
  #objective small { display: block; font-size: 13px; color: #ffd23f; letter-spacing: 1px; }
  #minimap { position: absolute; left: 16px; bottom: 96px; border: 2px solid rgba(255,255,255,.55); border-radius: 50%;
    background: rgba(5,10,25,.72); box-shadow: 0 0 0 3px rgba(0,0,0,.35); }
  #toast { position: absolute; left: 50%; bottom: 118px; transform: translateX(-50%); font-size: 22px; font-weight: 700;
    color: #ffd23f; text-align: center; }
  #crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%); font-size: 22px; color: rgba(255,255,255,.9); display: none; }
  #screen { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; pointer-events: none; }
  .panel { pointer-events: auto; width: 660px; max-width: 94vw; max-height: 92vh; overflow: auto; background: rgba(6,9,22,.88);
    border: 1px solid rgba(255,210,63,.5); border-radius: 14px; padding: 22px 28px; color: #eef1f5; box-shadow: 0 18px 60px rgba(0,0,0,.6); }
  .panel h1 { margin: 0; font-size: 52px; letter-spacing: 6px; color: #ffd23f; text-align: center; }
  .panel h1 span { color: #ff5d7a; }
  .panel h2 { margin: 2px 0 10px; text-align: center; font-size: 15px; letter-spacing: 3px; color: #9fd8ff; font-weight: 600; }
  .panel p { font-size: 15px; line-height: 1.5; color: #cfd6e4; margin: 8px 0; }
  .panel .btnrow { display: flex; gap: 10px; justify-content: center; margin: 14px 0 6px; flex-wrap: wrap; }
  .panel button { font-size: 18px; font-weight: 700; padding: 10px 22px; border-radius: 9px; border: none; cursor: pointer;
    background: #ffd23f; color: #1a1400; }
  .panel button.ghost { background: transparent; color: #ffd23f; border: 1px solid #ffd23f; }
  .missions { font-size: 13.5px; line-height: 1.45; margin: 10px 0; border-top: 1px solid rgba(255,255,255,.16); }
  .missions div { padding: 5px 2px; border-bottom: 1px solid rgba(255,255,255,.08); display: flex; justify-content: space-between; gap: 12px; }
  .missions b { color: #ffd23f; font-weight: 600; }
  .missions .done { color: #7dff9b; }
  .missions .pay { color: #7dff9b; white-space: nowrap; }
  .keys { font-size: 13px; color: #9aa3b5; text-align: center; line-height: 1.6; }
  #status { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  #vignette { position: fixed; inset: 0; pointer-events: none; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.45) 100%); }
</style>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>
<canvas id="game" aria-label="SOLMARA open-world crime game: drive, run missions and lose the police before Hurricane Ilsa hits"></canvas>
<div id="vignette"></div>
<div id="hud">
  <div class="top-left">
    <div id="wanted"></div>
    <div id="respect"></div>
    <div id="dayline"></div>
  </div>
  <div class="top-right">
    <div id="cash"></div>
    <div id="clock"></div>
    <div id="radio"></div>
  </div>
  <div id="objective"><small id="objlabel">SOLMARA</small><span id="objtext">Welcome to Solmara</span></div>
  <canvas id="minimap" width="180" height="180"></canvas>
  <div class="bottom-left">
    <div id="weapon"></div>
    <div id="healthbar"><div id="healthfill"></div></div>
    <div id="armorline"></div>
  </div>
  <div class="bottom-right">
    <div id="speed">0</div>
    <div id="speedunit">km/h</div>
    <div id="carname"></div>
  </div>
  <div id="toast"></div>
  <div id="crosshair">+</div>
</div>
<div id="screen"></div>
<p id="status" role="status" aria-live="polite"></p>
<script type="module" src="./src/main.js"></script>
</body>
</html>
